kind = "mobile"
previewPath = "/"
title = "Heavyar Mobile"
description = "The existing Heavyar Saudi high-value equipment-rental marketplace mobile application, imported from its canonical GitHub repository for a read-only production-readiness audit."
version = "1.0.0"
id = "artifacts/heavyar-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24231

[services.development]
run = "pnpm --filter @workspace/heavyar-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/heavyar-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/heavyar-mobile", "run", "serve" ]

[services.env]
PORT = "24231"
BASE_PATH = "/"
